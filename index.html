<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Expense Tracker</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">

        <h1>Student Expense Tracker</h1>
        <p class="subtitle">Manage your daily expenses</p>

        
        <div class="form-box">

            <h2>Add Expense</h2>

            <input type="text" id="expenseName" placeholder="Enter expense name">

            <input type="number" id="amount" placeholder="Enter amount">

            <select id="category">
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

            <button onclick="addExpense()">Add Expense</button>

        </div>


       
        <div class="total-box">

            <h2>Total Expenses</h2>

            <p id="total">₹0</p>

        </div>


        
        <div class="filter-box">

            <label for="filter">Filter by Category:</label>

            <select id="filter" onchange="displayExpenses()">

                <option value="All">All</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>

            </select>

        </div>


        
        <div class="expense-box">

            <h2>My Expenses</h2>

            <div id="expenseList">
                <p class="empty">No expenses added yet.</p>
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
